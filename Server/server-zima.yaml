---
apiVersion: homelab.io/v1alpha1
kind: Server
metadata:
  name: zima
  labels:
    homelab.io/ssh-management: enabled
    homelab.io/role: workstation
    homelab.io/kube-cluster: lab
    homelab.io/kube-role: control-plane
spec:
  provisioning:
    enabled: true
  operatingSystem:
    distribution: debian
    version: trixie
    architecture: amd64
    bootMode: uefi
  sshCertificateAuthorityRef: {name: homelab-user-ca}
  boot:
    isoRef: {name: debian-trixie-amd64}
  machineSelector:
    location:
      lldp_port: bridge/ether6
      switch_mac: d4:01:c3:27:91:67
  networking:
    management:
      interfaceSelector:
        attachedAtMachineLocation: true
      addressSelector:
        family: ipv4
        subnet: 10.1.1.0/24
