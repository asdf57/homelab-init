apiVersion: homelab.io/v1alpha1
kind: Configuration
metadata:
  name: lab-metallb
spec:
  # Keep suspended while the address pool and advertisement are being designed.
  suspended: true
  targetRef:
    kind: KubeCluster
    name: lab
  inventoryCaptureGroupRef:
    name: ssh-managed
  source:
    repositoryRef:
      name: ansible-roles
  command:
    argv:
      - ansible-playbook
      - plays/metallb.yml
      - -e
      - mode=install
  context:
    kubeClusterRef:
      name: lab
  dependsOn:
    - name: kube-setup-lab
