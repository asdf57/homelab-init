apiVersion: homelab.io/v1alpha1
kind: Configuration
metadata:
  name: lab-grafana
spec:
  targetRef:
    kind: KubeCluster
    name: lab
  inventoryCaptureGroupRef:
    name: ssh-managed
  source:
    repositoryRef:
      name: ansible-roles
  command:
    argv:
      - ansible-playbook
      - plays/grafana.yml
      - -e
      - mode=install
  context:
    kubeClusterRef:
      name: lab
  dependsOn:
    - name: kube-setup-lab
