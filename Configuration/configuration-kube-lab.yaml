# The target supplies settings; dependsOn supplies explicit readiness dependencies.
# The capture group supplies inventory; the command selects hosts and role order.
# The explicit extra-vars file supplies the operator's namespaced public context.
apiVersion: homelab.io/v1alpha1
kind: Configuration
metadata:
  name: kube-setup-lab
spec:
  targetRef:
    kind: KubeCluster
    name: lab
  inventoryCaptureGroupRef:
    name: ssh-managed
  source:
    repositoryRef:
      name: ansible-roles
  command:
    argv:
      - ansible-playbook
      - plays/configure_kube.yml
      - -e
      - "@../values.json"
  dependsOn: []
