apiVersion: homelab.io/v1alpha1
kind: InventoryCaptureGroup
metadata:
  name: ssh-managed
  labels:
    homelab.io/kube-cluster: lab
spec:
  selector:
    matchKinds: [{apiVersion: homelab.io/v1alpha1, kind: Server}]
    matchLabels: {homelab.io/ssh-management: enabled}
  groupVars:
    all:
      ansible_user: ansible
      ansible_become: true
      provision_disable_eee: true
