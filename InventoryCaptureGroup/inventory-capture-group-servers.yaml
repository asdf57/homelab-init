---
apiVersion: homelab.io/v1alpha1
kind: InventoryCaptureGroup
metadata:
  name: servers
spec:
  selector:
    matchKinds:
      - apiVersion: homelab.io/v1alpha1
        kind: Server
    matchLabels:
      homelab.io/role: workstation

  groups:
    - name: workstations
      selector:
        matchLabels:
          homelab.io/role: workstation

  groupVars:
    all:
      ansible_user: ansible
      ansible_ssh_private_key_file: /home/keiichi/.ssh/id_ansible_mgmt

    workstations:
      desktop_environment: true
